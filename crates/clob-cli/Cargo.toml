# Its own workspace — see the `exclude` note in the root Cargo.toml.
[workspace]

[package]
name = "clob-cli"
version = "0.1.0"
description = "Devnet operations for a ClobDex market: create, trade, inspect."
edition = "2024"
license = "MIT"
repository = "https://github.com/ClobDex/clobdex"
rust-version = "1.85"
readme = "README.md"
publish = false

[dependencies]
clob-book = { path = "../clob-book" }
clob-client = { path = "../clob-client" }
clob-engine = { path = "../clob-engine" }
clob-ops = { path = "../clob-ops" }
clob-program = { path = "../../programs/clob" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
spl-token = { version = "9", features = ["no-entrypoint"] }

solana-instruction = "3"
solana-keypair = "3"
solana-program-pack = "3"
solana-pubkey = "4"
solana-signer = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
