# Its own workspace — see the `exclude` note in the root Cargo.toml.
[workspace]

[package]
name = "clob-ops"
version = "0.1.0"
description = "Cluster plumbing shared by the ClobDex off-chain tools: config, transactions, and the market record."
edition = "2024"
license = "MIT"
repository = "https://github.com/ClobDex/clobdex"
rust-version = "1.85"
publish = false

[dependencies]
clob-client = { path = "../clob-client" }

anyhow = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

solana-client = "4"
solana-commitment-config = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-pubkey = "4"
solana-signer = "3"
solana-transaction = { version = "3", features = ["bincode"] }
dotenvy = "0.15.7"
