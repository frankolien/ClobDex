[package]
name = "clob-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "A terminal view of a ClobDex market: live book, tape and position."

# Its own workspace, like the other off-chain crates. Not because of a dependency conflict
# this time — nothing here touches solana-client — but because `cargo test --workspace` on
# the on-chain crates should not have to build a terminal library first.

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# `event-stream` gives the async `EventStream`. Without it the only way to read keys is a
# blocking poll, which in a select! loop means the socket stalls while nobody is typing.
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

# For the summary and the position, which are plain GETs rather than the socket. rustls
# rather than the system TLS, matching what the WebSocket already brings, so the binary
# carries one TLS stack and not two.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2", "charset"] }

# The lot geometry, rather than a second copy of it. `LotConfig` carries the exactness
# invariant the program is built on, and reimplementing tick maths in a viewer is how a
# screen ends up disagreeing with what settled.
clob-book = { path = "../clob-book" }
