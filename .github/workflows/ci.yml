# Every push, every branch.
#
# Five workspaces, because Cargo resolves one dependency graph per workspace and the
# on-chain crates cannot share a lockfile with an RPC client (see the `exclude` note in
# the root Cargo.toml). A single `cargo test` would silently cover one fifth of the repo,
# so each is invoked on its own and the matrix makes it obvious which one broke.
#
# There is no `cargo fmt --check`. The source is hand-wrapped — comment prose is broken at
# meaning rather than at a column — and rustfmt disagrees with it in 208 places at any
# width. Enforcing the tool would mean deleting that formatting, so lints are enforced and
# layout is not.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SOLANA_VERSION: 3.1.12

jobs:
  program:
    name: program and on-chain crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The CLI, and the platform-tools it pulls down on first use — several hundred
      # megabytes that have no reason to be fetched twice a day.
      - name: Cache the Solana toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      # Mollusk executes the compiled binary rather than the Rust library, so the tests
      # measure and assert against an artifact that has to exist before they run. A stale
      # or missing one is the single most common way these tests lie.
      - name: Install the Solana toolchain
        run: |
          if [ ! -x "$HOME/.local/share/solana/install/active_release/bin/solana" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build for SBF
        run: cargo build-sbf --manifest-path programs/clob/Cargo.toml

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Includes the conserve-funds campaign at its default size. Small enough to belong
      # here; the nightly workflow runs it at a size that finds things.
      - name: Test
        run: cargo test --workspace

  offchain:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      # One broken workspace should not hide the state of the other three.
      fail-fast: false
      matrix:
        workspace: [clob-ops, clob-cli, clob-mm, clob-stream]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.workspace }}

      # No SBF build: nothing off-chain runs the program, so these need a Rust toolchain
      # and nothing else.
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: crates/${{ matrix.workspace }}

      - name: Test
        run: cargo test
        working-directory: crates/${{ matrix.workspace }}

  # Three npm packages, each with its own lockfile, because each is its own deploy: the
  # SDK is published, the app is a static bundle at one origin and the site is a static
  # bundle at another. A matrix rather than three jobs so adding a fourth is one line, and
  # `fail-fast: false` so one broken package does not hide the state of the others.
  #
  # The app is checked out alongside the SDK and resolves it by path, so a wire-format
  # change that breaks the app fails here even though `npm ci` never fetched the SDK.
  typescript:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Includes the conformance suite against spec/wire-vectors.json. The Rust job
          # asserts that file still describes the Rust builders; this asserts TypeScript
          # reproduces it. A wire-format change that updates only one side fails here.
          - package: ts/sdk
            test: npm test
          - package: app
            test: npm test
          # No unit tests: the site is content. `astro check` typechecks every component
          # and the build is what proves the pages actually render — a template that
          # references a variable nothing defines fails there and nowhere else.
          - package: web
            test: npm run build
    steps:
      - uses: actions/checkout@v7

      # Node runs the TypeScript directly, so there is nothing to build before testing.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ matrix.package }}

      - name: Typecheck
        run: npm run typecheck
        working-directory: ${{ matrix.package }}

      - name: Test
        run: ${{ matrix.test }}
        working-directory: ${{ matrix.package }}
