[workspace]
resolver = "3"
members = ["crates/clob-book", "crates/clob-client", "crates/clob-engine", "crates/clob-indexer", "programs/clob"]

# The off-chain tools are separate workspaces, not members. Cargo resolves one dependency
# graph per workspace, including every member's dev-dependencies — so litesvm (pinned, and
# needing wincode 0.5) and solana-client (needing wincode 0.6) would have to agree, and
# they cannot. An on-chain program and an RPC client tool have no reason to share a
# lockfile; keeping them apart is what lets each pick the versions it actually needs.
#
# `exclude` does not override an explicit `members` entry, and `cargo init` writes one. A
# crate listed in both is a member — which is how `clob-tui` briefly pulled a terminal
# library into the on-chain build while this comment said it did not.
exclude = ["crates/clob-cli", "crates/clob-mm", "crates/clob-ops", "crates/clob-stream", "crates/clob-tui"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ClobDex/clobdex"
rust-version = "1.85"

[workspace.dependencies]
bytemuck = { version = "1.23", default-features = false }
proptest = "1.11"

# Release profile tuned for on-chain (SBF) builds: overflow checks stay ON because
# a panic on overflow is a transaction revert, which is the safe failure mode for a
# venue holding user funds. Silent wrapping is not.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
