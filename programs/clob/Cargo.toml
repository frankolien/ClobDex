[package]
name = "clob-program"
version = "0.1.0"
description = "Solana program exposing the ClobDex spot market: a crankless, atomically-settled CLOB."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
bytemuck.workspace = true
clob-book = { path = "../../crates/clob-book", default-features = false }
clob-engine = { path = "../../crates/clob-engine", default-features = false }
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-token = "0.7"

[dev-dependencies]
clob-client = { path = "../../crates/clob-client" }
litesvm = "=0.15.2"
mollusk-svm = "0.14"
mollusk-svm-programs-token = "0.14"
proptest.workspace = true
spl-token = { version = "9", features = ["no-entrypoint"] }
solana-account = "4"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-pubkey = "4"
solana-signer = "3"
solana-transaction = "4"

[features]
default = []
# Compiles the program's own test-only helpers. Not needed on-chain.
test-utils = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
